name: Release
on:
  push:
    tags: ['v*']
  # Dry run: builds all archives without publishing a release.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read project version and verify tag
        id: version
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match gradle.properties version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Extract release notes
        run: |
          awk -v h="## [${{ steps.version.outputs.version }}]" '
            index($0, h) == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            /^\[.*\]: / { next }
            found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section found for ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  package:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64, ext: tar.gz }
          - { os: macos-latest, name: macos-arm64, ext: tar.gz }
          - { os: windows-latest, name: windows-x64, ext: zip }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # Tests and formatting run once (Linux); other OSes only need the jars.
      - run: ./gradlew ${{ runner.os == 'Linux' && 'build' || 'installDist' }}
      - name: Build self-contained app image
        run: |
          jar="$(basename app/build/install/task-cli/lib/app-*.jar)"
          jpackage --type app-image --name task-cli \
            --input app/build/install/task-cli/lib \
            --main-jar "$jar" --main-class sh.roadmap.tasktracker.App \
            --add-modules java.base \
            ${{ runner.os == 'Windows' && '--win-console' || '' }} \
            --dest dist
      - name: Archive
        run: |
          out="task-cli-${{ needs.verify.outputs.version }}-${{ matrix.name }}.${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = zip ]; then
            7z a "$out" ./dist/task-cli
          else
            tar -czf "$out" -C dist task-cli
          fi
          echo "ARCHIVE=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/task-cli-* \
            --title "$GITHUB_REF_NAME" --notes-file artifacts/notes.md
